<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MavNext</title>
  <meta name="description" content="MavNext — a leadership workspace that helps student organization officers run their term and hand off each role to the next officer. Independent student pilot.">
  <link rel="icon" type="image/png" href="assets/mavnext-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link" onclick="var m=document.getElementById('main-content');if(m){m.focus();}return false;">Skip to main content</a>
  <div id="app" aria-live="off"></div>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">MavNext needs JavaScript enabled.</p></noscript>

  <!-- Order matters: plain scripts (no modules) so the app also opens from file:// -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/store.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/fixtures.js"></script>
  <script src="js/svc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views-work.js"></script>
  <script src="js/views-handoff.js"></script>
  <script src="js/views-admin.js"></script>
</body>
</html>
